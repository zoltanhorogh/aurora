name: Aurora alerts

on:
  schedule:
    - cron: "*/10 * * * *"   # test alerts before the cruise, real ones during it (the loggers run first)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write       # the watchdog starts the forecast

# Own queue (see update.yml); a newer waiting alert run replaces an older waiting one, which is fine.
concurrency:
  group: aurora-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest switches to 26 mid-cruise (19 Oct)
    timeout-minutes: 14
    # Each step has its own short limit: on 5 Oct 2026 21:00-23:20 one slow source made every run hit the old 8-minute
    # job limit, so nothing was saved and no alert went out during the biggest substorm (Masi -709 nT at 21:09).
    steps:
      - uses: actions/checkout@v5
        with:
          # the branch tip when the job starts, not the commit it was queued with:
          # a queued run read an old alert state and sent the camera alert twice (7-8 Oct 2026, 19:50/19:51 and 01:00/01:01)
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Log all-sky camera AI (ground truth for the model check)
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/sky_log.py
      - name: Log local magnetometer swing (live tile)
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/mag_log.py
      - name: Check conditions and notify
        timeout-minutes: 5
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python scripts/alert.py --test
          else
            python scripts/alert.py
          fi
      - name: Fresh forecast after an alert (the Tonight card then matches the message)
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f alert_sent.txt ] || exit 0
          age=$(python -c "import json,datetime as d; g=d.datetime.fromisoformat(json.load(open('data/latest.json'))['generated'].replace('Z','+00:00')); print(int((d.datetime.now(d.timezone.utc)-g).total_seconds()//60))" 2>/dev/null || echo 999)
          busy=$(gh run list --workflow update.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length')
          echo "alert sent; forecast is $age min old, $busy run(s) waiting or running"
          if [ "$age" -gt 20 ] && [ "$busy" = "0" ]; then gh workflow run update.yml --ref main && echo "forecast refresh started"; fi
      - name: Save alert state
        if: always()
        timeout-minutes: 2
        run: |
          git config user.name "aurora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # add only files that exist: one missing path (alert_state.json before the cruise) makes git add skip them all
          for f in data/alert_state.json data/hp30.json data/sky_obs.json data/mag.json data/shock.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Alert state $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((RANDOM % 10 + 5)); done
      - name: Watchdog (start the forecast if GitHub's schedule left it out)
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # overdue: 2 h during the cruise (hourly runs), 4 h before it (3-hourly runs)
          read due age < <(python -c "import json,datetime as d; now=d.datetime.now(d.timezone.utc); g=d.datetime.fromisoformat(json.load(open('data/latest.json'))['generated'].replace('Z','+00:00')); m=int((now-g).total_seconds()//60); lim=120 if now.month==10 and 10<=now.day<=24 else 240; print('yes' if m>lim else 'no', m)" 2>/dev/null || echo "no ?")
          busy=$(gh run list --workflow update.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length')
          echo "forecast is $age min old, $busy run(s) waiting or running"
          if [ "$due" = "yes" ] && [ "$busy" = "0" ]; then gh workflow run update.yml --ref main && echo "started the forecast"; fi
