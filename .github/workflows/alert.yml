name: Aurora alerts

on:
  schedule:
    - cron: "*/10 * * * *"   # the script exits immediately outside the cruise
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest switches to 26 mid-cruise (19 Oct)
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check conditions and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python scripts/alert.py --test
          else
            python scripts/alert.py
          fi
      - name: Log all-sky camera AI (ground truth for the model check)
        continue-on-error: true
        run: python scripts/sky_log.py
      - name: Log local magnetometer swing (live tile)
        continue-on-error: true
        run: python scripts/mag_log.py
      - name: Save alert state
        run: |
          git config user.name "aurora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # add only files that exist: one missing path (alert_state.json before the cruise) makes git add skip them all
          for f in data/alert_state.json data/hp30.json data/sky_obs.json data/mag.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Alert state $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
