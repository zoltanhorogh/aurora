name: Update forecast

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest switches to 26 mid-cruise (19 Oct)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build forecast
        run: python scripts/update.py
      - name: Commit data
        run: |
          git config user.name "aurora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Forecast update $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
